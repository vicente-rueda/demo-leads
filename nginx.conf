# Configuración de nginx para la web (sustituye a la de serie de la imagen).
# El HTTPS lo pone el proxy inverso (Traefik); aquí llega por HTTP en el puerto 80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No decir la versión de nginx en las respuestas ni en las páginas de error
    server_tokens off;
    charset utf-8;

    # Compresión: la página pasa de ~89 KB a ~25 KB
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Cabeceras de seguridad. Las ubicaciones de abajo solo usan «expires», que no
    # anula estas cabeceras (un «add_header» dentro de una ubicación sí lo haría).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Solo recursos propios; la única conexión externa es la de n8n (el Dockerfile la
    # cambia si se pasa N8N_BASE_URL). 'unsafe-inline' hace falta porque el script y
    # los estilos van dentro de index.html; los datos del visitante nunca se insertan
    # como HTML (siempre como texto), que es lo que evita la inyección de código.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://n8n.vicenterueda.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # La página: el navegador pregunta siempre si hay versión nueva (con ETag, sin
    # volver a descargarla si no ha cambiado), así un despliegue se ve al momento.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Recursos que no cambian. identidad.css lleva versión en el enlace (?v=fecha);
    # si cambia una fuente, se cambia también el nombre del archivo.
    location = /identidad.css { expires 1y; }
    location /fuentes/       { expires 1y; }
    location /logo/          { expires 30d; }
    location = /compartir.png { expires 7d; }
}
