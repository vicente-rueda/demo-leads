# Configuración de nginx para la web (sustituye a la de serie de la imagen).
# El HTTPS lo pone el proxy inverso (Traefik); aquí llega por HTTP en el puerto 80.

# Registro de accesos SIN direcciones IP: basta para ver errores y rastreos sin
# guardar datos personales. El «access_log» de dentro del «server» lo activa y
# sustituye al de serie de la imagen (que sí guarda la IP).
log_format sin_ip '[$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Solo en las páginas HTML: «no-transform» pide a Cloudflare (si va en naranja)
# que no modifique la página; si metiera su propio script, la CSP lo bloquearía.
map $sent_http_content_type $sin_transformar {
    ~^text/html "no-transform";
    default     "";
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sin_ip;
    root /usr/share/nginx/html;
    index index.html;

    # No decir la versión de nginx. Redirecciones relativas: detrás de Traefik una
    # absoluta saldría con http:// y con el nombre interno del contenedor.
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript text/plain application/xml image/svg+xml;

    # Compresión: la página y sus archivos ocupan unas 3-4 veces menos al viajar
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml application/json;

    # Cabeceras de seguridad. Las ubicaciones de abajo no usan «add_header» (si lo
    # usaran, perderían todas estas); «expires» y «default_type» no las anulan.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Vacía (no se envía) salvo en las páginas HTML: ver el «map» de arriba
    add_header Cache-Control $sin_transformar always;
    # Solo recursos propios y SIN 'unsafe-inline': el JavaScript y los estilos están
    # en demo.js y demo.css, nada dentro del HTML. Los datos estructurados
    # (application/ld+json) no son código y la CSP no los bloquea. La única conexión
    # externa es la de n8n (el Dockerfile la cambia si se pasa N8N_BASE_URL).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://n8n.vicenterueda.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Página de error propia (no la de nginx)
    error_page 404 /404.html;
    location = /404.html { internal; expires -1; }

    # La página: el navegador pregunta siempre si hay versión nueva (con ETag, sin
    # volver a descargarla si no ha cambiado), así un despliegue se ve al momento.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Recursos que no cambian. identidad.css, demo.css y demo.js llevan versión en el
    # enlace (?v=fecha): al cambiarlos, se cambia también la fecha en index.html y
    # 404.html. Si cambia una fuente, se cambia también el nombre del archivo.
    location = /identidad.css { expires 1y; }
    location = /demo.css      { expires 1y; }
    location = /demo.js       { expires 1y; }
    location /fuentes/        { expires 1y; }
    location /logo/           { expires 30d; }
    location = /compartir.png { expires 7d; }

    # /.well-known/ es pública por estándar (security.txt). «^~» hace que gane a la
    # regla de abajo, que bloquea todo lo que empieza por punto.
    location ^~ /.well-known/ {
        try_files $uri =404;
        default_type text/plain;
    }

    # Nada de archivos ocultos (.git, .env…)
    location ~ /\. { return 404; }
}
